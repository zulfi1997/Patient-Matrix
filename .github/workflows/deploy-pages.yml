name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/clinic-performance-dashboard-0qya0j
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Normally under a minute. A cap means a step that hangs rather than fails - which is how the
    # 6 Aug run burned fifteen minutes before being cancelled - gives up promptly and says so.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Gates the deploy: these cover the revenue/dedup logic, where a regression silently
      # misstates money rather than visibly breaking, so a failure must stop the release.
      - run: npm test
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      # If Pages is switched off on the repo, this step without enablement retries a 404ing Pages
      # API until the job is cancelled - fifteen minutes of silence, then a deploy that never ran
      # and a site serving GitHub's own 404 with nothing in the run to explain it. That is what
      # happened on 6 Aug. enablement: true turns the same situation into an immediate, named
      # failure: "Create Pages site failed. Resource not accessible by integration".
      #
      # It cannot fix it unaided. Creating a Pages site needs repo admin, which GITHUB_TOKEN does
      # not have however the pages permission is set, so switching Pages back on is a one-time
      # manual step: Settings -> Pages -> Source: GitHub Actions. Once Pages exists, this step
      # finds it and enablement is a no-op.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
