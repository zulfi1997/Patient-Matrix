name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/clinic-performance-dashboard-0qya0j
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Normally under a minute. A cap means a step that hangs rather than fails - which is how the
    # 6 Aug run burned fifteen minutes before being cancelled - gives up promptly and says so.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Gates the deploy: these cover the revenue/dedup logic, where a regression silently
      # misstates money rather than visibly breaking, so a failure must stop the release.
      - run: npm test
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      # enablement turns Pages on if it is off. Without it, this step hangs against a Pages API
      # that 404s, the build is eventually cancelled, and the site serves GitHub's own 404 page
      # with nothing in the run to say Pages was the problem. Needs the pages: write permission
      # granted above.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
